[project]
name = "git-automation"
version = "0.0.1"
description = "GUI git client + GitHub cockpit (desktop & web) with agentic workflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "khaled13a", email = "258786294+Khaled9013@users.noreply.github.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.1"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
git-automation = "git_automation.web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["git_automation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
